<!DOCTYPE html>
<html>
<body>
<textarea id="out" style="width:100%;height:200px"></textarea>
<script>
document.addEventListener("paste", (e) => {
  console.log('All types:', e.clipboardData.types)
  for (const type of e.clipboardData.types) {
    console.log('--- Type:', type)
    console.log('Value:', e.clipboardData.getData(type))
  }
})
</script>
</body>
</html>
